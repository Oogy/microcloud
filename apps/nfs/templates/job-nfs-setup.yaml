apiVersion: batch/v1
kind: Job
metadata:
  name: nfs-setup
  namespace: microcloud
spec:
  backoffLimit: 3
  template:
    spec:
      hostPID: true
      hostNetwork: true
      restartPolicy: OnFailure
      containers:
        - name: nfs-setup
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null
              install -m 0755 /opt/nfs-setup/nfs.sh /host/tmp/microcloud-nfs-setup.sh
              nsenter --target 1 --uts --mount -- /bin/sh -c "chroot /host /bin/bash /tmp/microcloud-nfs-setup.sh"
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: nfs-setup
              mountPath: /opt/nfs-setup
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: nfs-setup
          configMap:
            name: nfs-setup
